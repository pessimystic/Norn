<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>
        Norn-My Books
    </title>

</head>
<body>
<h1>My Books</h1>
<form method="get" th:action="@{/books}">
    <input type="text" name="q" th:value="${q}" placeholder="Search by title">
    <button>Search</button>
</form>

<p th:if="${#lists.isEmpty(books)}">No Books Found</p>


<table th:unless="${#lists.isEmpty(books)}" border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Title</th><th>Author</th><th>Genre</th><th>Status</th><th>Rating</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.genre}">Genre</td>
        <td th:text="${book.status}">Status</td>
        <td th:text="${book.rating}">Rating</td>
    </tr>
    </tbody>
</table>

<h2>Add New</h2>
<form method="post" th:action="@{/books}">
    <p><label>Title <input type="text" name="title" required></label></p>
    <p><label>Author<input type="text" name="author" required></label></p>
    <p><label>Genre<input type="text" name="genre" maxlength="100"></label></p>
    <p><label>Status
    <select name="status">
        <option value="TBR">TBR</option>
        <option value="READING">Reading</option>
        <option value="FINISHED">Finished</option>
    </select>
    </label></p>
    <p><label>Rating(&#9733)<input type="number" name="rating" min="1" max="5"></label></p>
    <p><label>Review <textarea name="review" rows="4" cols="40"></textarea></label></p>
    <button type="submit">Add Book</button>
</form>

</body>
</html>
